<!DOCTYPE html>
<html>
<head><title>Teste API</title></head>
<body>
  <h1>Testando API</h1>
  <pre id="resultado">Carregando...</pre>
  <script>
    fetch('https://db.ygoprodeck.com/api/v7/cardinfo.php?name=Dark%20Magician')
      .then(r => r.json())
      .then(data => {
        document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('resultado').textContent = 'Erro: ' + err;
      });
  </script>
</body>
</html>
