<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuelDex</title>

  <!-- GSAP (mantido para compatibilidade) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="src/css/reset.css" />
  <link rel="stylesheet" href="src/css/fontes.css" />
  <link rel="stylesheet" href="src/css/estilos.css" />
  <link rel="stylesheet" href="src/css/deck.css" />
  <link rel="stylesheet" href="src/css/temas.css" />
  <link rel="stylesheet" href="src/css/responsivo.css" />
</head>
<body>
  <!-- HEADER COM LOGO E FILTROS NA MESMA LINHA -->
  <header class="cabecalho">
    <h1 class="titulo">
      <img src="./src/imagens/imagens/logo.png" alt="Logo DuelDex" class="logo-site" />
    </h1>
    
    <!-- BARRA DE PESQUISA AGORA DENTRO DO HEADER -->
    <div id="filtros">
      <input type="text" id="input-nome" placeholder="Buscar..." />

      <select id="filtro-atributo">
        <option value="all">Atributo</option>
        <option value="DARK">Trevas</option>
        <option value="LIGHT">Luz</option>
        <option value="FIRE">Fogo</option>
        <option value="WATER">Água</option>
        <option value="EARTH">Terra</option>
        <option value="WIND">Vento</option>
        <option value="DIVINE">Divino</option>
      </select>

      <select id="filtro-tipo">
        <option value="all">Tipo</option>
        <option value="Normal Monster">Monstro Normal</option>
        <option value="Effect Monster">Monstro de Efeito</option>
        <option value="Fusion Monster">Monstro de Fusão</option>
        <option value="Synchro Monster">Monstro Sincro</option>
        <option value="XYZ Monster">Monstro XYZ</option>
        <option value="Link Monster">Monstro Link</option>
        <option value="Pendulum Monster">Monstro Pêndulo</option>
        <option value="Ritual Monster">Monstro Ritual</option>
        <option value="Spell Card">Mágica</option>
        <option value="Trap Card">Armadilha</option>
      </select>

      <select id="filtro-nivel">
        <option value="all">Nível</option>
        <option value="1">★1</option>
        <option value="2">★★2</option>
        <option value="3">★★★3</option>
        <option value="4">★★★★4</option>
        <option value="5">★★★★★5</option>
        <option value="6">★★★★★★6</option>
        <option value="7">★★★★★★★7</option>
        <option value="8">★★★★★★★★8</option>
        <option value="9">★★★★★★★★★9</option>
        <option value="10">★★★★★★★★★★10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>

      <button id="btn-limpar-filtros">Limpar</button>
      <button id="btn-buscar">Buscar</button>
      <button id="btn-favoritos">Favoritos</button>
      <button id="btn-todos">Todos</button>
      <button id="btn-decks">Decks</button>
    </div>
  </header>

  <main>
    <!-- CONTAINER DAS CARTAS -->
    <ul class="lista-personagens" id="lista-cartas"></ul>

    <!-- PAGINAÇÃO -->
    <div id="paginacao">
      <button id="btn-anterior" disabled>Anterior</button>
      <span id="contador-pagina">Página 1 de 1</span>
      <button id="btn-proximo" disabled>Próximo</button>
    </div>
  </main>

  <!-- 🔥 FOOTER (RODAPÉ) COM CRÉDITOS -->
  <footer class="rodape">
    <p>Projeto desenvolvido apenas para estudos.</p>
    <p>Dados fornecidos pela <a href="https://db.ygoprodeck.com/" target="_blank">YGOPRODeck API</a>.</p>
    <p>Desenvolvido por <a href="https://github.com/Guspelepe" target="_blank">Guspelepe</a> | <a href="https://github.com/Guspelepe/Projeto_Yu_gi_oh-WIP-" target="_blank">Repositório do Projeto</a></p>
  </footer>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="main.js"></script>
</body>
</html>
